<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>河南五城深度参考行程地图 · 郑州/宝泉/登封/洛阳/开封</title>
<meta name="description" content="11.3–11.7 河南五城自驾+高铁参考行程地图（含车票D230/D232、四晚酒店、少林/宝泉/龙门/万岁山一篇秒懂导览图与高德一键导航）">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg-primary:    #ffffff;
  --bg-secondary:  #f5f5f7;
  --bg-tertiary:   #fbfbfd;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:   #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary:  #aeaeb2;
  --accent:        #0071e3;
  --accent-hover:  #0077ed;
  --tint-red:    #ff3b30;
  --tint-orange: #ff9500;
  --tint-green:  #34c759;
  --tint-blue:   #007aff;
  --tint-purple: #af52de;
  --tint-pink:   #ff2d55;
  --separator:  rgba(60, 60, 67, .12);
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 14px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 30px rgba(0,0,0,.12);
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-xl:  20px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "PingFang SC", "Helvetica Neue", "Arial", sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.47059;
  letter-spacing: -0.022em;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Map ── */
#map { width: 100%; height: 39vh; min-height: 265px; position: sticky; top: 0; z-index: 100; }
.locate-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
  border: none; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.locate-btn.active { color: #007aff; }
.basemap-btn {
  padding: 6px 11px; border-radius: 8px;
  background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: .5px solid var(--separator); box-shadow: 0 1px 4px rgba(0,0,0,.18);
  font-size: 12px; font-weight: 600; color: var(--text-primary);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.basemap-btn:active { transform: scale(.96); }
@keyframes loc-pulse {
  0%   { transform: scale(1); opacity: .55; }
  100% { transform: scale(2.4); opacity: 0; }
}
.loc-pulse {
  width: 14px; height: 14px; border-radius: 50%;
  background: rgba(0,122,255,.25);
  animation: loc-pulse 1.6s ease-out infinite;
}

/* ── Tabs ── */
.tabs {
  display: flex; gap: 6px; padding: 11px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  background: rgba(255,255,255,.88); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); position: sticky; top: 39vh; z-index: 99;
  border-bottom: .5px solid var(--separator); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 7px 16px; border-radius: 980px; border: none;
  background: var(--bg-grouped); color: var(--text-secondary);
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all .25s ease;
  white-space: nowrap; letter-spacing: -0.01em;
}
.tab:active { transform: scale(.96); }
.tab.active { background: var(--accent); color: #fff; }

/* ── Main content ── */
.content { max-width: 680px; margin: 0 auto; padding: 14px 16px calc(28px + var(--safe-bottom)); }

/* ── Overview ── */
.hero { text-align: center; padding: 20px 12px 16px; }
.hero h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.2; }
.hero .subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 6px; font-weight: 400; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: 13px 15px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 4px; }
.info-card .value { font-size: 13.5px; font-weight: 600; line-height: 1.45; }

/* ── Section headers ── */
.section-head { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; padding: 16px 0 8px; }

/* ── Day header ── */
.day-head { padding: 14px 0 10px; }
.day-head h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.day-head p { font-size: 13.5px; color: var(--text-secondary); margin-top: 3px; }

/* ── Route bar ── */
.route-bar { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); font-size: 13px; color: var(--text-secondary); line-height: 1.68; white-space: pre-line; border-left: 3.5px solid var(--accent); }
.route-bar strong { color: var(--text-primary); }

/* ── Timeline ── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 20px; bottom: 20px; width: 1.5px; background: var(--separator); }
.tl-item { position: relative; margin-bottom: 11px; }
.tl-dot { position: absolute; left: -20px; top: 18px; width: 10px; height: 10px; border-radius: 50%; z-index: 1; box-shadow: 0 0 0 3px var(--bg-secondary); }
.tl-dot.food    { background: var(--tint-red); }
.tl-dot.spot    { background: var(--tint-blue); }
.tl-dot.hotel   { background: var(--tint-orange); }
.tl-dot.drink   { background: var(--tint-purple); }
.tl-dot.transport { background: var(--text-tertiary); }

/* ── Card ── */
.card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .25s ease; cursor: pointer; }
.card:active { box-shadow: var(--shadow-md); }
.card .time { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .01em; }
.card .name { font-size: 16.5px; font-weight: 600; margin: 2px 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.48; }

/* Badge */
.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.badge.food   { background: rgba(255,59,48,.1);  color: var(--tint-red); }
.badge.spot   { background: rgba(0,122,255,.1);  color: var(--tint-blue); }
.badge.drink  { background: rgba(175,82,222,.1); color: var(--tint-purple); }
.badge.hotel  { background: rgba(255,149,0,.14); color: #d97706; }
.badge.transport { background: rgba(142,142,147,.15); color: var(--text-secondary); }

/* Budget */
.budget { display: inline-block; margin-top: 6px; padding: 3px 10px; background: var(--bg-grouped); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }

/* Payment */
.pays { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pay { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.pay.ok  { background: rgba(52,199,89,.1);  color: var(--tint-green); }
.pay.no  { background: rgba(255,59,48,.08); color: var(--tint-red); }
.pay.idk { background: rgba(255,149,0,.1);  color: var(--tint-orange); }

/* Links row */
.links { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 13px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; border: none; cursor: pointer;
  text-decoration: none !important; transition: filter .2s;
}
.btn:active { filter: brightness(.9); }
.btn.nav    { background: var(--accent); color: #fff; }
.btn.xhs    { background: #ff2442; color: #fff; }
.btn.dp     { background: #ffa700; color: #fff; }
.btn.rsv    { background: var(--tint-green); color: #fff; }

/* ── Visual "一篇秒懂" Guide Map Cards (Fig 1 Style) ── */
.guide-map-box {
  margin-top: 12px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(107, 131, 104, .28);
  background: #f7f3e8;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}
.guide-map-header {
  background: #6b8368;
  color: #ffffff;
  text-align: center;
  padding: 8px 12px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.guide-map-header .zoom-hint {
  font-size: 11px;
  font-weight: 500;
  background: rgba(255,255,255,.2);
  padding: 2px 8px;
  border-radius: 99px;
}
.guide-map-img {
  width: 100%;
  height: auto;
  display: block;
  cursor: zoom-in;
}
.guide-map-svg-wrap {
  width: 100%;
  background: #f7f3e8;
  padding: 6px 6px 2px;
}
.guide-map-svg-wrap svg {
  width: 100%;
  height: auto;
  display: block;
}
.guide-map-strategies {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 8px 10px 10px;
  background: #f7f3e8;
}
@media (max-width: 480px) {
  .guide-map-strategies { grid-template-columns: 1fr; }
}
.guide-strat-card {
  background: #b7c6b1;
  color: #1f291e;
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 12.2px;
  line-height: 1.52;
}
.guide-strat-card.highlight {
  background: #9fb896;
  border: 1.5px solid #4e6b48;
}
.guide-strat-card h5 {
  font-size: 13.5px;
  font-weight: 800;
  margin-bottom: 4px;
  color: #141c13;
}

/* Lightbox Modal for full-screen guide maps */
.lightbox-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,.86); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.lightbox-overlay.show { display: flex; }
.lightbox-overlay img {
  max-width: 100%; max-height: 90vh; border-radius: 12px; object-fit: contain;
}
.lightbox-close {
  position: absolute; top: 18px; right: 18px;
  background: rgba(255,255,255,.2); color: #fff; border: none;
  width: 38px; height: 38px; border-radius: 50%; font-size: 20px; cursor: pointer;
}

/* Action Sheet */
.as-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.35); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.as-overlay.show { opacity: 1; pointer-events: auto; }
.as-sheet {
  width: 100%; max-width: 420px;
  padding: 0 8px 34px;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.22,1,.36,1);
}
.as-overlay.show .as-sheet { transform: translateY(0); }
.as-group {
  background: rgba(255,255,255,.92); backdrop-filter: blur(20px);
  border-radius: 14px; overflow: hidden; margin-bottom: 8px;
}
.as-group .as-item {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px; font-size: 17px; color: #007aff; font-weight: 500;
  border: none; background: none; width: 100%; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.as-group .as-item + .as-item { border-top: .5px solid rgba(0,0,0,.12); }
.as-group .as-item:active { background: rgba(0,0,0,.06); }
.as-cancel { font-weight: 600; }

/* Details — default open */
.details {
  margin-top: 10px; padding-top: 10px;
  border-top: .5px solid var(--separator);
  font-size: 13px; color: var(--text-secondary); line-height: 1.65;
}
.details.closed { display: none; }

/* ── Overview day list ── */
.day-list .card { margin-bottom: 8px; }
.day-list .card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* ── Payment & Tips summary ── */
.pay-summary { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.pay-summary h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.pay-summary .warn { color: var(--tint-red); font-weight: 600; }
.pay-summary .ok-text { color: var(--tint-green); font-weight: 600; }
.pay-summary .accent-text { color: var(--accent); font-weight: 600; }

/* ── Legend ── */
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Leaflet overrides ── */
.leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important; }
.leaflet-popup-content { font-size: 14px !important; line-height: 1.5 !important; margin: 12px 14px !important; }
.leaflet-popup-content a { color: var(--accent) !important; }
.leaflet-popup-tip { background: #fff !important; }
.leaflet-control-zoom a { width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 16px !important; border-radius: 10px !important; background: rgba(255,255,255,.85) !important; -webkit-backdrop-filter: blur(10px) !important; backdrop-filter: blur(10px) !important; border: .5px solid var(--separator) !important; color: var(--text-primary) !important; }
.leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow-md) !important; border: none !important; }
.leaflet-control-attribution { font-size: 9px !important; opacity: .5; }
.popup-nav-btn { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
</style>
</head>

<div id="map"></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
  <button type="button" class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="景区导览图">
</div>

// ║  MAP ENGINE (Keyless Gaode Chinese Vector + OSM Switcher)    ║
// ╚══════════════════════════════════════════════════════════════╝

const map = L.map('map', { center: [HOTEL.lat || 34.75, HOTEL.lng || 113.66], zoom: 8, zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'topright' }).addTo(map);

const BASEMAPS = [
  {
    id: 'amap',
    name: '🗺️ 底图：高德中文（免Key极速）',
    url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    opts: { subdomains: ['1', '2', '3', '4'], maxZoom: 18, attribution: '© 高德地图 AutoNavi' },
    gcj02: true
  },
  {
    id: 'osm',
    name: '🌍 底图：OpenStreetMap（全球免Key）',
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    opts: { maxZoom: 19, attribution: '© OpenStreetMap' },
    gcj02: false
  },
  {
    id: 'esri',
    name: '✨ 底图：Esri 浅灰极简（免Key）',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 16, attribution: '© Esri' },
    gcj02: false
  }
];
let curBasemapIdx = 0;
let activeTileLayer = L.tileLayer(BASEMAPS[0].url, BASEMAPS[0].opts).addTo(map);

function outOfChina(lat, lon) {
  return (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271);
}
function transformLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function transformLon(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
  return ret;
}
function toMapCoord(lat, lon) {
  if (!BASEMAPS[curBasemapIdx].gcj02 || outOfChina(lat, lon)) return [lat, lon];
  const a = 6378245.0, ee = 0.00669342162296594323;
  let dLat = transformLat(lon - 105.0, lat - 35.0);
  let dLon = transformLon(lon - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lat + dLat, lon + dLon];
}

const BasemapControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const btn = L.DomUtil.create('button', 'basemap-btn');
    btn.type = 'button';
    btn.textContent = BASEMAPS[curBasemapIdx].name;
    btn.title = '点击切换地图源（高德中文 / OpenStreetMap / Esri）';
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener('click', () => {
      curBasemapIdx = (curBasemapIdx + 1) % BASEMAPS.length;
      map.removeLayer(activeTileLayer);
      activeTileLayer = L.tileLayer(BASEMAPS[curBasemapIdx].url, BASEMAPS[curBasemapIdx].opts).addTo(map);
      btn.textContent = BASEMAPS[curBasemapIdx].name;
      showDay(cur);
    });
    return btn;
  }
});
new BasemapControl().addTo(map);

const LocateControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const btn = L.DomUtil.create('button', 'locate-btn');
    btn.innerHTML = '📍';
    btn.title = '我的位置';
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener('click', () => {
      btn.classList.add('active');
      map.locate({ setView: true, maxZoom: 15 });
    });
    this._btn = btn;
    return btn;
  }
});
new LocateControl().addTo(map);
let locMarker, locCircle;
map.on('locationfound', e => {
  const r = e.accuracy / 2;
  const pt = toMapCoord(e.latlng.lat, e.latlng.lng);
  if (locMarker) { locMarker.setLatLng(pt); locCircle.setLatLng(pt).setRadius(r); }
  else {
    locMarker = L.marker(pt, {
      icon: L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#007aff;border:2.5px solid #fff;box-shadow:0 0 6px rgba(0,122,255,.5)"></div><div class="loc-pulse" style="position:absolute;top:0;left:0"></div>', iconSize:[14,14], iconAnchor:[7,7] }),
      zIndexOffset: 2000
    }).addTo(map);
    locCircle = L.circle(pt, { radius: r, color: '#007aff', fillColor: '#007aff', fillOpacity: .08, weight: 1 }).addTo(map);
  }
});
map.on('locationerror', () => {});

function icon(color, emoji) {
  return L.divIcon({ className: '', html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)">${emoji||''}</div>`, iconSize: [28,28], iconAnchor: [14,14], popupAnchor: [0,-16] });
}

let markers = [], polylines = [];
const emojis = { food:'🍽️', spot:'📍', hotel:'🏨', transport:'🚄', drink:'🍵' };

function clearMap() { markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; }

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const pts = [];
    DAYS.forEach(d => d.locations.forEach(l => { if(l.lat) pts.push(toMapCoord(l.lat,l.lng)); }));
    if(pts.length) map.fitBounds(pts, {padding:[30,30]});
    DAYS.slice(1).forEach(d => {
      const dayPts = [];
      d.locations.filter(l=>l.time!=='—').forEach(l => {
        const pt = toMapCoord(l.lat, l.lng);
        dayPts.push(pt);
        const m = L.circleMarker(pt, { radius:5, fillColor:d.color, color:'#fff', weight:1.5, fillOpacity:.92 }).addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#86868b">${d.label} · ${l.time}</span>`);
        markers.push(m);
      });
      if(dayPts.length > 1) {
        const pl = L.polyline(dayPts, { color:d.color, weight:2, opacity:.45, dashArray:'4,4' }).addTo(map);
        polylines.push(pl);
      }
    });
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  day.locations.forEach(l => {
    if(!l.lat) return;
    const pt = toMapCoord(l.lat, l.lng);
    const m = L.marker(pt, { icon: icon(day.color, emojis[l.type]||'📌') }).addTo(map);
    const gmapQ = l.gmap||encodeURIComponent(l.name);
    const safeName = l.name.replace(/'/g, "\\'");
    m.bindPopup(`<b>${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b">'+l.time+'</span>':''}<br>${l.desc}${l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':''}<br><button type="button" class="popup-nav-btn" onclick="openAS('${safeName}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</button>${l.reserve?' · <a href="'+l.reserve+'" target="_blank" rel="noopener">🔗 详情/预约</a>':''}`);
    markers.push(m);
    if(l.time!=='—') coords.push(pt);
  });
  if(coords.length>1) { const pl = L.polyline(coords, { color:day.color, weight:2.5, opacity:.55, dashArray:'6,5' }).addTo(map); polylines.push(pl); }
  if(coords.length) map.fitBounds(coords, { padding:[40,40], maxZoom:14 });
}

// ══════════ RENDER ══════════
function payChips(pay) {
  if(!pay) return '';
  let h = '<div class="pays">';
  const m = { wechat:'💚 微信支付', alipay:'💙 支付宝', card:'💳 刷卡/免押', cash:'💴 现金' };
  for(const [k,label] of Object.entries(m)) {
    if(pay[k]!==undefined) { const c = pay[k]===1?'ok':pay[k]===0.5?'idk':'no'; h += `<span class="pay ${c}">${label}</span>`; }
  }
  return h+'</div>';
}

const IN_APP_WEBVIEW = (() => {
  const ua = (navigator.userAgent || '').toLowerCase();
  return /micromessenger|xhs|xhsdiscover|discover\/|tiktok|aweme|weibo|qq\/|qqbrowser|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/.test(ua);
})();

function xhsKeyword(loc) {
  if(loc.xhsKeyword) return loc.xhsKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function xhsAppUrl(loc) { return `xhsdiscover://search/result?keyword=${encodeURIComponent(xhsKeyword(loc))}&target_search=notes&source=deeplink`; }
function xhsWebUrl(loc) { return `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(xhsKeyword(loc))}&source=web_explore_feed`; }

function dpKeyword(loc) {
  if(loc.dianpingKeyword) return loc.dianpingKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function dpAppUrl(loc) { return `dianping://searchshoplist?keyword=${encodeURIComponent(dpKeyword(loc))}`; }
function dpWebUrl(loc) { return `https://m.dianping.com/searchshop?keyword=${encodeURIComponent(dpKeyword(loc))}`; }

window._extLocs = {};
DAYS.forEach(d => d.locations.forEach(l => { window._extLocs[`${d.id}::${l.name}`] = l; }));

const IS_MOBILE = /iPad|iPhone|iPod|Android/i.test(navigator.userAgent || '');
function openExt(key, kind) {
  const loc = window._extLocs[key]; if(!loc) return false;
  if (IS_MOBILE && !IN_APP_WEBVIEW) {
    window.location.href = kind==='dp' ? dpAppUrl(loc) : xhsAppUrl(loc);
  } else {
    window.open(kind==='dp' ? dpWebUrl(loc) : xhsWebUrl(loc), '_blank');
  }
  return false;
}
function openXhs(key) { return openExt(key, 'xhs'); }
function openDp(key)  { return openExt(key, 'dp'); }

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  lb.classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function locCard(loc, dayIdx) {
  const dot = loc.type==='food'?'food':loc.type==='spot'?'spot':loc.type==='drink'?'drink':loc.type==='hotel'?'hotel':'transport';
  const bdg = loc.type==='food'?'<span class="badge food">餐</span>':loc.type==='spot'?'<span class="badge spot">景</span>':loc.type==='drink'?'<span class="badge drink">饮</span>':loc.type==='hotel'?'<span class="badge hotel">住/车</span>':'<span class="badge transport">车票/行</span>';
  const uid = `d${dayIdx}-${loc.name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'')}`;
  const locKey = `${dayIdx}::${loc.name}`;
  const gmapQ = loc.gmap||encodeURIComponent(loc.name);
  let lnk = `<button type="button" class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${gmapQ}')">📍 导航</button>`;
  if(loc.xhs||loc.xhsKeyword) {
    const xhsHref = xhsWebUrl(loc);
    lnk += `<a href="${xhsHref}" target="_blank" rel="noopener" onclick="return openXhs('${locKey.replace(/'/g,"\\'")}')" class="btn xhs">📕 小红书</a>`;
  }
  const dpEnabled = loc.dianping !== false &&
    (loc.dianping || loc.dianpingKeyword || loc.type==='food' || loc.type==='drink');
  if(dpEnabled) {
    const dpHref = dpWebUrl(loc);
    lnk += `<a href="${dpHref}" target="_blank" rel="noopener" onclick="return openDp('${locKey.replace(/'/g,"\\'")}')" class="btn dp">🍜 大众点评</a>`;
  }
  if(loc.reserve) lnk += `<a href="${loc.reserve}" target="_blank" rel="noopener" class="btn rsv">📅 官网/指南</a>`;
  const guideHtml = (loc.guideKey && VISUAL_GUIDES[loc.guideKey]) ? VISUAL_GUIDES[loc.guideKey] : '';
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="if(!event.target.closest('.btn,.links,.guide-map-box'))toggle('${uid}')"><div class="time">${loc.time!=='—'?loc.time:'备选'}</div><div class="name">${bdg} ${loc.name}</div><div class="desc">${loc.desc}</div>${loc.budget?'<div class="budget">'+loc.budget+'</div>':''}${payChips(loc.pay)}<div class="links">${lnk}</div>${guideHtml}${loc.detail?'<div class="details" id="'+uid+'">'+loc.detail.replace(/\n/g,'<br>')+'</div>':''}</div></div>`;
}

function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  if(d.routeSummary) h += `<div class="route-bar">${d.routeSummary}</div>`;
  if(main.length) { h += '<div class="section-head">当日行程时间轴（含直观导览图与一键高德导航）</div><div class="timeline">'; main.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">顺路备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  return h;
}

// ══════════ NAV ══════════
let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

DAYS.forEach(d => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab' + (d.id===0?' active':'');
  btn.dataset.day = d.id;
  btn.textContent = d.label;
  tabsEl.appendChild(btn);
});

function go(idx) {
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day===idx));
  contentEl.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx);
  window.scrollTo({top:0, behavior:'smooth'});
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}

function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }

tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });

go(0);

/* ── Action Sheet for Navigation ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet">
  <div class="as-group" id="as-opts"></div>
  <div class="as-group"><button type="button" class="as-item as-cancel" onclick="closeAS()">取消</button></div>
</div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
const IS_ANDROID = /Android/i.test(navigator.userAgent || '');

function amapAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=1`;
}
function amapNaviAppUrl(name, lat, lng) {
  const scheme = IS_IOS ? 'iosamap' : 'androidamap';
  return `${scheme}://navi?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=1&style=2`;
}
function amapWebUrl(name, lat, lng) {
  return `https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=wgs84&callnative=1`;
}
function amapNaviWebUrl(name, lat, lng) {
  return `https://uri.amap.com/navigation?to=${lng},${lat},${encodeURIComponent(name)}&mode=car&src=trip&coordinate=wgs84&callnative=1`;
}
function openAmap(name, lat, lng, mode) {
  const isNavi = mode === 'navi';
  if ((IS_IOS || IS_ANDROID) && !IN_APP_WEBVIEW) {
    window.location.href = isNavi ? amapNaviAppUrl(name, lat, lng) : amapAppUrl(name, lat, lng);
    setTimeout(() => {
      if (!document.hidden) {
        window.location.href = isNavi ? amapNaviWebUrl(name, lat, lng) : amapWebUrl(name, lat, lng);
      }
    }, 1200);
    return;
  }
  window.open(isNavi ? amapNaviWebUrl(name, lat, lng) : amapWebUrl(name, lat, lng), '_blank');
}

function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name);
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g, "\\'");
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('as-opts').innerHTML =
    `<button type="button" class="as-item" onclick="openAmap('${safeName}',${lat},${lng},'navi');closeAS()">🚗 高德地图 App（一键路线导航）</button>` +
    `<button type="button" class="as-item" onclick="openAmap('${safeName}',${lat},${lng},'marker');closeAS()">🧭 高德地图 App（查看标点位置）</button>` +
    `<button type="button" class="as-item" onclick="window.open('${appleUrl}','_blank');closeAS()">🍎 Apple 地图</button>` +
    `<button type="button" class="as-item" onclick="window.open('${googleUrl}','_blank');closeAS()">🗺️ Google Maps</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>
